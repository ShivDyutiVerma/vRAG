[project]
name = "vrag"
version = "0.1.0"
description = "Voice-enabled RAG over ai4bharat/MSMARCO-XI — HH Goa Task 2, server-side pipeline under 200ms."
requires-python = ">=3.11"

# Base deps are unconditional: Dockerfile does a plain `pip install -e .` (no extras), so anything
# the FastAPI app / harness needs at import time must live here, not in an optional group.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "websockets>=13.1",
  "tenacity>=9.0",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.2",
]

[project.optional-dependencies]
# Workstream R: chunking, embeddings, dense/sparse index, hybrid retrieval, reranking
retrieval = [
  "numpy>=2.5",
  "datasets>=5.0",
  # huggingface-hub / transformers: ceiling, not just a floor, on purpose (docs/DECISIONS_R.md
  # R-019) — optimum-onnx==0.1.0 (needed for ONNX export/quantisation) hard-pins
  # transformers<4.58.0, incompatible with the >=5.15 floor this project used before ONNX work
  # started. Verified safe at the resolved versions (huggingface-hub 0.36.2, transformers
  # 4.57.6): full test suite green, every embedder smoke-tested against the downgrade.
  "huggingface-hub>=0.23,<2.0",
  "faiss-cpu>=1.15",
  "bm25s>=0.3",
  "onnxruntime>=1.28",
  "onnx>=1.22",
  "optimum>=2.1",
  "optimum-onnx>=0.1",  # ONNX export + quantisation (docs/DECISIONS_R.md R-019)
  # torch: no version floor here on purpose. A plain `pip install -e .` pulls the CPU-only
  # wheel from PyPI (fine for CI/fresh clones). On a machine with an NVIDIA GPU, install the
  # CUDA build AFTER this instead — it's ~16x faster for index-build-time embedding
  # (docs/DECISIONS_R.md R-005) — and its version numbers lag PyPI's CPU releases (e.g.
  # 2.6.0+cu124 vs a CPU-only 2.13+), so pinning a high floor here would make pip "fix" a
  # working GPU install back to CPU-only on the next `pip install -e .`:
  #   pip install torch --index-url https://download.pytorch.org/whl/cu124 --force-reinstall --no-deps
  "torch",
  "transformers>=4.41,<4.58",  # ceiling from optimum-onnx, see huggingface-hub comment above
  "sentence-transformers[onnx]>=5.7",
  "rerankers>=0.10",
  "flashrank>=0.2",  # rerankers' FlashRank backend needs this installed separately (R-011)
]
# Workstream P: generation, guardrails beyond regex/lexical, telemetry analysis extras.
# Empty for now — G1/G2/G5 are pure-stdlib regex/lexical (docs/TECH_MENU.md §S3), no heavy deps
# needed yet. Add here (not to base `dependencies`) the moment Track B generation or a guardrail
# classifier needs one, so a plain `pip install -e .` in the Dockerfile stays lightweight.
pipeline = []
# Shared: eval scripts, latency analysis, charts
analysis = [
  "polars>=1.43",
  "matplotlib>=3.11",
]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "mypy>=2.3",
  "pre-commit>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Matches this dev machine's actual interpreter (3.13, see docs/DECISIONS_R.md R-001), not the
# project's minimum supported version (3.11) — needed because numpy 2.5's type stubs use 3.12+
# syntax that mypy can't parse when told to target 3.11. Doesn't affect runtime compatibility;
# our own code still targets 3.11+ per pyproject.toml's requires-python.
python_version = "3.13"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party libs with no type stubs / py.typed marker as of their current release.
module = ["bm25s.*", "rerankers.*", "onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
